services:
  db:
    image: postgres:16
    container_name: agromanage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agromanage
      POSTGRES_PASSWORD: agromanage
      POSTGRES_DB: agromanage
    ports:
      # Porta 5433 no host: a 5432 já está em uso pelo PostgreSQL local da máquina.
      - "127.0.0.1:5433:5432"
    volumes:
      - agromanage_pgdata:/var/lib/postgresql/data

volumes:
  agromanage_pgdata:
